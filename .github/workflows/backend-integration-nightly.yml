name: Backend Integration Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Install from uv.lock, not from the ranges in pyproject.toml. `pip install
      # -e ./backend[dev]` re-resolved every range on every run, so the job tested
      # whatever PyPI served that morning while the image built from the lock --
      # the tests were the only part of the repository that was not reproducible.
      # It failed exactly as you would expect: main went red three weeks after its
      # last commit, when mcp 2.2 changed how a tool reports an error. Dependabot
      # already proposes every upgrade as a reviewable pull request; this makes
      # that the only way one arrives.
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip 'uv==0.11.13'
          uv export --frozen --directory backend --extra dev --no-emit-project \
            --format requirements-txt --output-file /tmp/requirements.txt > /dev/null
          python -m pip install --require-hashes -r /tmp/requirements.txt
          python -m pip install --no-deps -e ./backend

      - name: Run integration suite
        env:
          COGRAPH_RUN_INTEGRATION: "1"
          COGRAPH_INTEGRATION_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: >-
          python -m pytest
          backend/integration_tests/test_core_infra.py
          backend/integration_tests/test_graph_api.py
          backend/integration_tests/test_retrieval_api.py
          backend/integration_tests/test_wiki_incremental_pg.py
          -q
