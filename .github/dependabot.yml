version: 2

# One pull request per dependency put every ecosystem on its
# open-pull-requests-limit at once (5+5+5+3+3 = 21), and a saturated limit
# freezes version updates until the queue drains — so the routine bumps
# blocked each other rather than landing.
#
# The groups below collapse the routine half into one pull request per
# ecosystem. Majors are deliberately left out of every group: those are the
# ones that need someone to read a changelog, and grouping them means one
# breaking bump holds a dozen harmless ones hostage.
#
# Security updates stay ungrouped on purpose. They are not subject to the
# limit above, and one pull request per advisory is the fastest thing to
# review and merge when it matters.

updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend:
        applies-to: version-updates
        patterns:
          - "*"
        # tree-sitter-language-pack is pinned to an exact version on purpose:
        # backend/app/graph/parser.py drives its `download` /
        # `downloaded_languages` helpers to bake every grammar into the image
        # at build time, and the Dockerfile asserts none are missing. Those
        # helpers changed shape after 1.6, so the bump needs the loader
        # rewritten — grouped, it fails that assert and takes ten harmless
        # bumps down with it. Ungrouped, it arrives as its own pull request,
        # which is what a change requiring code deserves.
        exclude-patterns:
          - "tree-sitter*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
    versioning-strategy: increase
    groups:
      frontend:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docs"
    commit-message:
      prefix: "chore(deps)"
    versioning-strategy: increase
    groups:
      docs:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "docker"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
