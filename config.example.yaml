# Cograph — example local configuration.
#
# Copy to `config.yaml` (gitignored) and edit. Every setting here can also be
# set as an environment variable: COGRAPH_<GROUP>__<FIELD>, double underscore
# between group and field, e.g. COGRAPH_EMBEDDING__API_KEY.
#
# IMPORTANT: environment variables OVERRIDE this file, not the other way round.
#
# The commented groups at the bottom are optional — shown with their defaults so
# you can see what exists. Full reference: https://cograph.cc/configuration
#
# NOTE: this file configures the *deployment*. Which model does what is stored in
# the database and set in the admin UI (Admin -> LLM runtime). A repository will
# not index until the `embedding` role is assigned there.

app_name: Cograph
environment: development
version: 0.1.0
api_prefix: /api

database:
  url: postgresql+asyncpg://postgres:postgres@localhost:5432/cograph
  echo: false

redis:
  url: redis://localhost:6379/0
  # In production, Redis-backed rate limiting is mandatory unless this is true.
  allow_in_memory_rate_limit_fallback: false

git:
  checkouts_root: .cograph/checkouts

auth:
  # Production refuses to boot on a placeholder or a secret under 32 chars.
  jwt_secret: change-me-in-production
  access_token_ttl_seconds: 900
  refresh_token_ttl_seconds: 604800
  registration_enabled: false
  # Anonymous browsing. Only ever exposes repositories whose visibility is
  # `public`; both this and the per-repository setting must agree.
  public_read: false
  secure_cookies: false
  # Pin the public origin when behind a proxy, or OIDC redirect_uri checks fail.
  # external_url: https://cograph.example.com
  #
  # Set both, then run `cograph-backend reencrypt-secrets`, so that rotating
  # jwt_secret does not invalidate stored provider and IdP credentials.
  # llm_encryption_secret: ""
  # oidc_encryption_secret: ""

cors:
  allowed_origins:
    - http://localhost:5173
    - http://localhost:3000

embedding:
  # Mandatory for indexing. The pipeline reads its provider from the database,
  # but batch_size/dimensions and the query-time embedding path use these.
  enabled: true
  api_url: https://api.openai.com/v1
  api_key: set-me
  model: text-embedding-3-small
  # Validated: 1536 is the only accepted value.
  dimensions: 1536
  batch_size: 256
  request_timeout_seconds: 120.0
  connect_timeout_seconds: 10.0

completion:
  # Needed for generated summaries and wiki pages. Without it those two
  # pipeline steps are recorded as skipped; indexing and search still work.
  enabled: false
  api_url: https://api.openai.com/v1
  api_key: ""
  model: gpt-5.4-mini
  request_timeout_seconds: 120.0
  connect_timeout_seconds: 10.0

# logging:
#   level: INFO          # DEBUG | INFO | WARNING | ERROR | CRITICAL
#   format: text         # `json` wherever logs are shipped to a collector
#   access_log: true

# retrieval:
