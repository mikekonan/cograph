#     # Only `disabled` and `local_cross_encoder` are implemented;
#     # cohere / voyage / jina raise NotImplementedError.
#     # `local_cross_encoder` needs the [reranker-local] extra (~500MB torch).
#     provider: disabled
#     model: cross-encoder/ms-marco-MiniLM-L-6-v2

