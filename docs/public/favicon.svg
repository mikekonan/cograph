<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Cograph">
  <!-- Three connected nodes: the code-graph mark, in the app's accent violet.
       Colours are literal because a favicon is fetched outside the page and
       cannot resolve CSS custom properties. #7c3aed = --color-accent,
       #a78bfa = --color-violet-300. -->
  <title>Cograph</title>
  <g fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round">
    <path d="M11 9.5 22.5 16" opacity=".55" />
    <path d="M11 9.5 10.5 23" opacity=".55" />
    <path d="M22.5 16 10.5 23" opacity=".55" />
  </g>
  <circle cx="11" cy="9.5" r="5" fill="#7c3aed" />
  <circle cx="22.5" cy="16" r="3.5" fill="#a78bfa" />
  <circle cx="10.5" cy="23" r="3.5" fill="#a78bfa" />
</svg>
